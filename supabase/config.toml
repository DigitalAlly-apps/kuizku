
[functions.suggest-essay-grades]
enabled = true
# Auth tetap diverifikasi oleh withSupabase({ auth: "user" }) di dalam function.
# Gateway legacy dimatikan agar access token dengan signing key baru tidak ditolak sebelum handler berjalan.
verify_jwt = false
import_map = "./functions/suggest-essay-grades/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/suggest-essay-grades/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/suggest-essay-grades/*.html" ]
